name: CI — LightningPoS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Firmware POS : JC3248W535C / ESP32-S3 (esp-idf-hal, std) ─────
  build-espidf:
    name: Build firmware-espidf (ESP32-S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installe la toolchain Rust Xtensa (espup) + ldproxy, requis par
      # le linker déclaré dans firmware-espidf/.cargo/config.toml.
      # Version épinglée sur celle qui compile localement (1.95.0.0).
      - name: Install Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true
          version: 1.95.0.0

      # ESP-IDF est installé par esp-idf-sys (embuild) au moment du build.
      # ESP_IDF_VERSION épingle la v5.2.3 ciblée par le firmware.
      - name: Build firmware
        working-directory: firmware-espidf
        env:
          ESP_IDF_VERSION: v5.2.3
        run: cargo +esp build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-espidf
          path: firmware-espidf/target/xtensa-esp32s3-espidf/release/firmware-espidf
          if-no-files-found: error

  # ─── Security audit ───────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/audit@v1
