[workspace]
resolver = "2"
members = [
    "lightningpos-core",
    "lightningpos-hal",
    "lightningpos-nfc",
    "lightningpos-display",
    "lightningpos-net",
    "lightningpos-firmware",
    "firmware-touch35",
    "firmware-headless",
    "firmware-c3",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["LightningPoS Contributors"]
repository = "https://github.com/Silexperience210/lightningpos-rs"

[workspace.dependencies]
# ESP32 HAL and runtime
esp-hal = { version = "0.23", features = ["esp32s3"] }
esp-println = { version = "0.13", features = ["esp32s3", "log"] }
esp-wifi = { version = "0.11", features = ["esp32s3", "wifi", "utils", "embassy-net"] }
esp-storage = "0.4"
esp-alloc = "0.6"

# Async runtime
embassy-executor = { version = "0.7", features = ["task-arena-size-32768"] }
embassy-time = "0.4"
embassy-net = { version = "0.6", features = ["tcp", "udp", "dns", "dhcpv4", "proto-ipv4"] }
embassy-sync = "0.6"
embassy-futures = "0.1"

# Serialization
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }

# Networking
embedded-io = "0.6"
embedded-io-async = "0.6"

# Data structures
heapless = "0.8"
hash32 = "0.3"

# Crypto & encoding
bech32 = "0.11"
sha2 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

# QR Code
qrcodegen = { version = "1", default-features = false }

# Logging
log = "0.4"
defmt = "0.3"
defmt-rtt = "0.4"

# Error handling
thiserror = { version = "2", default-features = false }

# Utilities
micromath = "2"
nb = "1"
embedded-hal = "1"
embedded-hal-async = "1"
embedded-hal-bus = "0.2"
